# 목적: 멀티테넌트 데이터소스 기본 정보를 정의한다.
# 기능: 테넌트별 DB 접속 정보를 분리해 관리한다.
# 이유: 기업별 DB 분리를 유지하고 운영 환경에서 교체가 쉽도록 한다.
# 유지보수: 운영 환경에서는 각 기업별 값을 안전하게 분리해 관리한다.

# 기본(공통) 테넌트
# 목적: 개발 단계에서 최소 구동을 위한 기본 테넌트 정보를 제공한다.
# 기능: 기본 테넌트 연결 정보를 정의한다.
# 이유: 초기 개발/테스트에서 공통 연결 기준을 만들기 위함이다.
# 유지보수: 운영 환경에서는 실제 기업 기본 테넌트로 교체한다.
db.default.driver=org.mariadb.jdbc.Driver
db.default.url=jdbc:mariadb://localhost:3306/mes_default
db.default.username=mes_user
db.default.password=mes_password

# 기업 A 테넌트(예시)
# 목적: 기업별 DB 분리 샘플을 제공한다.
# 기능: 기업 A 전용 DB 연결 정보를 정의한다.
# 이유: 멀티테넌트 라우팅 테스트에 활용한다.
# 유지보수: 실제 기업 목록에 맞춰 추가/삭제한다.
db.companyA.driver=org.mariadb.jdbc.Driver
db.companyA.url=jdbc:mariadb://localhost:3306/mes_company_a
db.companyA.username=mes_user
db.companyA.password=mes_password
